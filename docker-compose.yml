services:

  # ── Frontend (React + Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: coreline_frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coreline_net

  # ── Backend (FastAPI Mail) ─────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coreline_backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./server/.env
    environment:
      - ENV=production
      - ALLOWED_ORIGIN=https://yourdomain.com
    networks:
      - coreline_net

networks:
  coreline_net:
    driver: bridge
